<!doctype html>
<html lang="en" data-theme="dark" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Malcom IO — Custom software, healthcare systems to Mac apps</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SEO (static fallback; the SEO strategy re-bakes these per route at prerender) -->
  <meta name="description" content="Malcom IO designs, builds and runs custom software: healthcare systems built for 21 CFR Part 11 and HIPAA, web and mobile apps, and native Mac software.">
  <link rel="canonical" href="https://www.malcom.io/">
  <meta name="theme-color" content="#20242a">
  <!-- The theme, before first paint: a saved choice, otherwise dark for the studio site
       and light for the Oregon health plan pages. Keep the path prefix and keys in step
       with shared/theme.service.ts. -->
  <script>
    (function () {
      try {
        var path = location.pathname.replace(/\/+$/, '');
        var prefix = '/oregon-universal-health-plan';
        var oregon = path === prefix || path.indexOf(prefix + '/') === 0;
        var theme = null;
        try { theme = localStorage.getItem(oregon ? 'theme-oregon' : 'theme'); } catch (e) {}
        // No saved choice: the part's own default, in case this markup is the 404 fallback.
        if (theme !== 'light' && theme !== 'dark') theme = oregon ? 'light' : 'dark';
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-bs-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#f1f6f0' : '#20242a');
      } catch (e) {}
    })();
  </script>
  <!-- Without JavaScript the switch cannot work. -->
  <noscript><style>.theme-toggle { display: none !important; }</style></noscript>

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Malcom IO">
  <meta property="og:title" content="Malcom IO — Custom software, healthcare systems to Mac apps">
  <meta property="og:description" content="Malcom IO designs, builds and runs custom software: healthcare systems built for 21 CFR Part 11 and HIPAA, web and mobile apps, and native Mac software.">
  <meta property="og:url" content="https://www.malcom.io/">
  <meta property="og:image" content="https://www.malcom.io/assets/img/og-card.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Malcom IO — Custom software, healthcare systems to Mac apps">
  <meta name="twitter:description" content="Malcom IO designs, builds and runs custom software: healthcare systems built for 21 CFR Part 11 and HIPAA, web and mobile apps, and native Mac software.">
  <meta name="twitter:image" content="https://www.malcom.io/assets/img/og-card.png">

  <link rel="icon" href="/favicon.ico?v=2" sizes="32x32">
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body>
  <app-root></app-root>
</body>
</html>
